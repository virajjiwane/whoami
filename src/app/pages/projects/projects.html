<!-- Projects grid -->
<section class="py-16 px-6 sm:px-10 max-w-6xl mx-auto">
    <a
        [routerLink]="''"
        aria-label="Go Home"
        class="group inline-flex items-center justify-center w-10 h-10 rounded-full bg-[#1F2937]/60 border border-gray-700 text-gray-400 hover:bg-blue-500/10 hover:text-blue-400 transition-colors duration-200">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-5 h-5">
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 9.75L12 3l9 6.75M4.5 10.5V21h15V10.5" />
        </svg>
    </a>
    <div class="text-center space-y-6 mx-5">
        <div
            class="relative inline-block px-4 sm:px-0 opacity-0"
            [appIntersection]
            (viewChange)="animationService.handleViewChange($event, 'animate-fade-in-up-bounce')">
            <div
                class="absolute -inset-1 bg-linear-to-r from-blue-500 via-purple-500 to-pink-500 rounded-2xl blur-xl opacity-75"></div>
            <h1
                class="relative text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-bold tracking-tight bg-clip-text text-transparent bg-linear-to-r from-white to-gray-300 pb-2">
                My Work
            </h1>
        </div>
    </div>
    <div class="grid gap-10 md:grid-cols-2 mt-6">
        <!-- Project card -->
        @if (!projects) {
            <div class="text-center space-y-6">
                <h2
                    class="relative text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-bold tracking-tight bg-clip-text text-transparent bg-linear-to-r from-white to-gray-300 pb-2">
                    No Projects
                </h2>
            </div>
        } @else {
            @for (item of projects | keyvalue; track $index) {
                @let projectKey = item.key;
                @let project = item.value;

                <div class="project-card group">
                    <a
                        [routerLink]="`${projectKey}`"
                        class="block bg-[#161B22] border border-gray-800 rounded-xl p-6 opacity-0"
                        [appIntersection]="{
                            root: null,
                            rootMargin: '0px',
                            threshold: 0.2,
                        }"
                        (viewChange)="
                            animationService.handleViewChange($event, 'animate-fade-in-up')
                        ">
                        <img
                            src="{{ project.architecture }}"
                            alt="{{ project.name }}"
                            class="rounded-lg mb-6 bg-black/30 p-4" />
                        @if (project?.isConfidential) {
                            <span
                                class="inline-flex items-center gap-1.5 px-3 py-1 mb-6 rounded-full bg-red-500/10 border border-red-500/30 text-red-400 text-[11px] font-medium uppercase tracking-wider select-none">
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 24 24"
                                    fill="currentColor"
                                    class="w-3.5 h-3.5">
                                    <path
                                        fill-rule="evenodd"
                                        d="M12 1.5a4.5 4.5 0 00-4.5 4.5V9H6a3 3 0 00-3 3v7.5A3 3 0 006 22.5h12a3 3 0 003-3V12a3 3 0 00-3-3h-1.5V6A4.5 4.5 0 0012 1.5zm-3 7.5V6a3 3 0 116 0v3H9z"
                                        clip-rule="evenodd" />
                                </svg>
                                Confidential
                            </span>
                        }
                        <h2
                            class="text-2xl font-bold mb-3 group-hover:text-blue-400 transition 0.18s ease">
                            {{ project.name }}
                        </h2>
                        <p class="text-gray-400 text-sm leading-relaxed mb-4">
                            {{ project.description }}
                        </p>
                        <div class="text-teal-400 text-sm font-medium flex items-center gap-1">
                            <span>View Details</span>
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                class="w-4 h-4">
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M13 7l5 5m0 0l-5 5m5-5H6" />
                            </svg>
                        </div>
                    </a>
                </div>
            }
        }
    </div>
</section>
