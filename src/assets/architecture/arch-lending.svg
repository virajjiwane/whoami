        <text x="145" y="344" text-anchor="middle" fill="#9CA3AF" font-size="12px">EC2 Instance #1</text>

        <rect x="260" y="320" width="180" height="40" rx="4" stroke-width="1" fill="rgba(239,68,68,0.2)"
