        <text x="130" y="179" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(Django)</text>

        <rect x="263" y="135" width="180" height="64" rx="4" stroke-width="1" fill="rgba(168,85,247,0.2)"
            stroke="#A855F7"></rect>
        <text x="353" y="159" text-anchor="middle" fill="#9CA3AF" font-size="12px">New LMS Tasks &amp; Jobs</text>
        <text x="353" y="179" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(Celery
