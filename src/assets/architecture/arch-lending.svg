        <text x="240" y="434" text-anchor="middle" fill="#9CA3AF" font-size="12px">New LMS DB</text>
        <text x="240" y="454" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(PostgreSQL)</text>

        <rect x="470" y="410" width="400" height="64" rx="4" stroke-width="1" fill="rgba(168,85,247,0.2)"
            stroke="#A855F7"></rect>
        <text x="670" y="434" text-anchor="middle" fill="#9CA3AF" font-size="12px">Legacy Investment DB</text>
        <text x="660" y="454" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(PostgreSQL)</text>
