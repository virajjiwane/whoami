<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LenDenClub Investment Architecture"
    width="100%" height="100%">
    <!-- Web + Mobile Apps -->
    <g>
        <rect x="40" y="46" width="405" height="64" rx="4" stroke-width="1" fill="rgba(59,130,246,0.2)"
