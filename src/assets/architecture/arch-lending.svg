        <text x="247" y="70" text-anchor="middle" fill="#9CA3AF" font-size="12px">Investment Web APP</text>
        <text x="247" y="90" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(Angular)</text>

        <rect x="465" y="46" width="405" height="64" rx="4" stroke-width="1" fill="rgba(59,130,246,0.2)"
