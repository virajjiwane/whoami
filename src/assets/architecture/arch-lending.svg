    </g>

    <!-- Connection lines -->
    <g stroke-width="1" stroke="#4B5563" fill="none">
        <line x1="130" y1="199" x2="130" y2="230"></line>
        <line x1="353" y1="199" x2="353" y2="230"></line>
        <line x1="779" y1="199" x2="779" y2="230"></line>
        <line x1="130" y1="270" x2="130" y2="320"></line>
        <line x1="353" y1="270" x2="353" y2="320"></line>
        <line x1="566" y1="269" x2="566" y2="320"></line>
        <line x1="779" y1="270" x2="779" y2="320"></line>
    </g>
