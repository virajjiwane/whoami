        <text x="350" y="344" text-anchor="middle" fill="#9CA3AF" font-size="12px">EC2 Instance #2</text>

        <rect x="480" y="320" width="180" height="40" rx="4" stroke-width="1" fill="rgba(239,68,68,0.2)"
            stroke="#EF4444"></rect>
        <text x="570" y="344" text-anchor="middle" fill="#9CA3AF" font-size="12px">EC2 Instance #3</text>

        <rect x="689" y="320" width="180" height="40" rx="4" stroke-width="1" fill="rgba(239,68,68,0.2)"
            stroke="#EF4444"></rect>
        <text x="779" y="344" text-anchor="middle" fill="#9CA3AF" font-size="12px">EC2 Instance #4</text>
    </g>

    <!-- Databases -->
    <g>
        <rect x="40" y="410" width="400" height="64" rx="4" stroke-width="1" fill="rgba(168,85,247,0.2)"
