        <text x="566" y="210" text-anchor="middle" fill="#9CA3AF" font-size="12px">Redis Commander</text>

        <rect x="689" y="135" width="180" height="64" rx="4" stroke-width="1" fill="rgba(168,85,247,0.2)"
