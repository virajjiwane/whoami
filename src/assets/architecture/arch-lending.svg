        <text x="672" y="70" text-anchor="middle" fill="#9CA3AF" font-size="12px">Investment Mobile APP</text>
        <text x="672" y="90" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(Flutter)</text>
    </g>

    <!-- Backends -->
    <g>
        <rect x="40" y="135" width="190" height="64" rx="4" stroke-width="1" fill="rgba(168,85,247,0.2)"
