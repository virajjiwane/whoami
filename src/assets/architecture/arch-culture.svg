<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NLP Analytics Project Architecture"
    width="100%" height="100%">
    <!-- Title -->
    <g>
        <rect x="40" y="18" width="820" height="40" rx="4" stroke-width="1" fill="rgba(59,130,246,0.2)"
            stroke="#3B82F6"></rect>
        <text x="450" y="42" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            Culture Analytics Dashboard
        </text>
    </g>

    <!-- Nginx + PHP -->
    <g>
        <rect x="40" y="84" width="410" height="40" rx="4" stroke-width="1" fill="rgba(168,85,247,0.2)"
            stroke="#A855F7"></rect>
        <text x="245" y="108" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            Nginx (reverse proxy)
        </text>

        <rect x="480" y="84" width="380" height="40" rx="4" stroke-width="1" fill="rgba(168,85,247,0.2)"
            stroke="#A855F7"></rect>
        <text x="670" y="108" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            PHP (legacy UI)
        </text>
    </g>

    <!-- Azure Docker -->
    <g>
        <rect x="40" y="150" width="820" height="40" rx="4" stroke-width="1" fill="rgba(59,130,246,0.2)"
            stroke="#3B82F6"></rect>
        <text x="450" y="174" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            Azure Docker Container
        </text>
    </g>

    <!-- LLM -->
    <g>
        <rect x="40" y="216" width="260" height="136" rx="4" stroke-width="1" fill="rgba(59,130,246,0.2)"
            stroke="#3B82F6"></rect>
        <text x="170" y="280" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            LLM
        </text>
        <text x="170" y="300" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">
            Insight Inference
        </text>
    </g>

    <!-- Docker Containers -->
    <g>
        <rect x="320" y="216" width="240" height="80" rx="4" stroke-width="1" fill="rgba(168,85,247,0.2)"
            stroke="#A855F7"></rect>
        <text x="440" y="250" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            Docker Container #1
        </text>
        <text x="440" y="270" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">
            ETL · Sentiment Analysis
        </text>

        <rect x="580" y="216" width="280" height="80" rx="4" stroke-width="1" fill="rgba(168,85,247,0.2)"
            stroke="#A855F7"></rect>
        <text x="720" y="250" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            Docker Container #2
        </text>
        <text x="720" y="270" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">
            Aggregation · Trends
        </text>
    </g>

    <!-- VMs -->
    <g>
        <rect x="320" y="312" width="240" height="40" rx="4" stroke-width="1" fill="rgba(20,184,166,0.2)"
            stroke="#14B8A6"></rect>
        <text x="440" y="336" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            Tesla T4 V3 GPU VM
        </text>

        <rect x="580" y="312" width="280" height="40" rx="4" stroke-width="1" fill="rgba(20,184,166,0.2)"
            stroke="#14B8A6"></rect>
        <text x="720" y="336" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            F16 V2 VM
        </text>
    </g>

    <!-- Databases -->
    <g>
        <rect x="40" y="374" width="240" height="64" rx="4" stroke-width="1" fill="rgba(239,68,68,0.2)"
            stroke="#EF4444"></rect>
        <text x="160" y="398" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            Ingest DB
        </text>
        <text x="160" y="418" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">
            (Azure Flexible MySQL)
        </text>

        <rect x="330" y="374" width="240" height="64" rx="4" stroke-width="1" fill="rgba(239,68,68,0.2)"
            stroke="#EF4444"></rect>
        <text x="450" y="398" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            Pipeline DB
        </text>
        <text x="450" y="418" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">
            (Azure Flexible MySQL)
        </text>

        <rect x="620" y="374" width="240" height="64" rx="4" stroke-width="1" fill="rgba(239,68,68,0.2)"
            stroke="#EF4444"></rect>
        <text x="740" y="398" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            EDASurveys DB
        </text>
        <text x="740" y="418" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">
            (Azure Flexible MySQL)
        </text>
    </g>

    <!-- CI/CD + Git -->
    <g>
        <rect x="40" y="460" width="400" height="40" rx="4" stroke-width="1" fill="rgba(168,85,247,0.2)"
            stroke="#A855F7"></rect>
        <text x="240" y="484" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            Bitbucket CI/CD Pipeline
        </text>

        <rect x="460" y="460" width="400" height="40" rx="4" stroke-width="1" fill="rgba(168,85,247,0.2)"
            stroke="#A855F7"></rect>
        <text x="660" y="484" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            Git / Bitbucket (Version Control)
        </text>
    </g>

    <!-- Cloud -->
    <g>
        <rect x="40" y="520" width="820" height="40" rx="4" stroke-width="1" fill="rgba(20,184,166,0.2)"
            stroke="#14B8A6"></rect>
        <text x="450" y="544" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            Microsoft Azure Cloud Infrastructure
        </text>
    </g>
</svg>