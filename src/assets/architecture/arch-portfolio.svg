<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Portfolio architecture (Angular 20 · EmailJS · Render CI/CD)" width="100%" height="100%">
  <!-- Frontend (Angular 20) -->
  <g style="filter:drop-shadow(0 6px 18px rgba(2,6,23,0.45));">
    <rect x="240" y="40" width="420" height="80" rx="6"
      style="fill:rgba(59,130,246,0.12);stroke:#3B82F6;stroke-width:1;" />
    <text x="450" y="70" text-anchor="middle"
      style="fill:#9CA3AF;font-size:12px;font-family:Roboto,system-ui,-apple-system,'Segoe UI',Arial;font-weight:600;">
      Frontend — Angular 20
    </text>
    <text x="450" y="90" text-anchor="middle"
      style="fill:#9CA3AF;font-size:11px;font-family:Roboto,system-ui,-apple-system,'Segoe UI',Arial;font-weight:300;">
      Standalone components · Signals · TypeScript · TailwindCSS
    </text>
  </g>

  <!-- EmailJS (Serverless Contact) -->
  <g style="filter:drop-shadow(0 6px 18px rgba(2,6,23,0.45));">
    <rect x="240" y="140" width="420" height="80" rx="6"
