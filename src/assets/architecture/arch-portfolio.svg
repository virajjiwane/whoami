    </text>
  </g>

  <!-- Pre-rendered / Static Assets -->
  <g style="filter:drop-shadow(0 6px 18px rgba(2,6,23,0.45));">
    <rect x="240" y="240" width="420" height="80" rx="6"
      style="fill:rgba(239,68,68,0.2);stroke:#EF4444;stroke-width:1;" />
    <text x="450" y="270" text-anchor="middle"
      style="fill:#9CA3AF;font-size:12px;font-family:Roboto,system-ui,-apple-system,'Segoe UI',Arial;">
      Pre-rendered Routes &amp; Static Assets
    </text>
    <text x="450" y="290" text-anchor="middle"
      style="fill:#9CA3AF;font-size:11px;font-family:Roboto,system-ui,-apple-system,'Segoe UI',Arial;font-weight:300;">
