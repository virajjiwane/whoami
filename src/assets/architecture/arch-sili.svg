<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SILI Tool Architecture"
    width="100%" height="100%">
    <!-- Sensors -->
    <g>
        <rect x="20" y="20" width="360" height="40" rx="4" stroke-width="1" fill="rgba(59,130,246,0.2)"
            stroke="#3B82F6"></rect>
        <text x="200" y="45" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            Sensors (Arduino)
        </text>
    </g>

    <!-- Edge Preprocessing -->
    <g>
        <rect x="20" y="100" width="360" height="40" rx="4" stroke-width="1" fill="rgba(168,85,247,0.2)"
            stroke="#A855F7"></rect>
        <text x="200" y="125" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            Edge Preprocessing → Telemetry
        </text>
    </g>

    <!-- Cloud Models + Dashboard -->
    <g>
        <rect x="20" y="180" width="360" height="40" rx="4" stroke-width="1" fill="rgba(20,184,166,0.2)"
            stroke="#14B8A6"></rect>
        <text x="200" y="205" text-anchor="middle" fill="#9CA3AF" font-size="12px">
            Cloud Models + Dashboard (Django + Keras)
        </text>
    </g>

    <!-- Connection Lines -->
    <g stroke-width="1" stroke="#4B5563" fill="none">
        <line x1="200" y1="60" x2="200" y2="100"></line>
        <line x1="200" y1="140" x2="200" y2="180"></line>
    </g>
</svg>