<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Review ME System Architecture" width="100%" height="100%">
    
    <!-- Frontend Layer -->
    <g>
        <rect x="40" y="7" width="500" height="64" rx="4" stroke-width="1" fill="rgba(59,130,246,0.2)" stroke="#3B82F6"></rect>
        <text x="290" y="31" text-anchor="middle" fill="#9CA3AF" font-size="12px">Angular Dashboard</text>
        <text x="290" y="51" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(Tailwind CSS • Sentiment Visualizations • Trend Charts)</text>
        
        <rect x="560" y="7" width="150" height="64" rx="4" stroke-width="1" fill="rgba(59,130,246,0.2)" stroke="#3B82F6"></rect>
        <text x="635" y="31" text-anchor="middle" fill="#9CA3AF" font-size="12px">Interactive Filters</text>
        <text x="635" y="51" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(Sentiment • Platform)</text>
        
        <rect x="730" y="7" width="130" height="64" rx="4" stroke-width="1" fill="rgba(59,130,246,0.2)" stroke="#3B82F6"></rect>
        <text x="795" y="31" text-anchor="middle" fill="#9CA3AF" font-size="12px">Export Reports</text>
        <text x="795" y="51" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(CSV • PDF)</text>
    </g>
    
    <!-- Backend + NLP Layer -->
    <g>
        <rect x="40" y="96" width="200" height="64" rx="4" stroke-width="1" fill="rgba(168,85,247,0.2)" stroke="#A855F7"></rect>
        <text x="140" y="120" text-anchor="middle" fill="#9CA3AF" font-size="12px">Django REST Framework</text>
        <text x="140" y="140" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(API Backend)</text>
        
        <rect x="260" y="96" width="170" height="64" rx="4" stroke-width="1" fill="rgba(249,115,22,0.2)" stroke="#F97316"></rect>
        <text x="345" y="120" text-anchor="middle" fill="#9CA3AF" font-size="12px">NLTK</text>
        <text x="345" y="140" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(Sentiment Analysis)</text>
        
        <rect x="450" y="96" width="190" height="64" rx="4" stroke-width="1" fill="rgba(249,115,22,0.2)" stroke="#F97316"></rect>
        <text x="545" y="120" text-anchor="middle" fill="#9CA3AF" font-size="12px">Sentence Transformers</text>
        <text x="545" y="140" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(Semantic Analysis)</text>
        
        <rect x="660" y="96" width="200" height="64" rx="4" stroke-width="1" fill="rgba(168,85,247,0.2)" stroke="#A855F7"></rect>
        <text x="760" y="120" text-anchor="middle" fill="#9CA3AF" font-size="12px">Celery Workers</text>
        <text x="760" y="140" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(NLP Job Processing)</text>
    </g>
    
    <!-- Async Processing Layer -->
    <g>
        <rect x="40" y="191" width="200" height="50" rx="4" stroke-width="1" fill="rgba(236,72,153,0.2)" stroke="#EC4899"></rect>
        <text x="140" y="215" text-anchor="middle" fill="#9CA3AF" font-size="12px">Celery</text>
        <text x="140" y="231" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(Task Queue)</text>
        
        <rect x="260" y="191" width="170" height="50" rx="4" stroke-width="1" fill="rgba(236,72,153,0.2)" stroke="#EC4899"></rect>
        <text x="345" y="215" text-anchor="middle" fill="#9CA3AF" font-size="12px">Redis</text>
        <text x="345" y="231" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(Message Broker)</text>
        
        <rect x="660" y="191" width="200" height="50" rx="4" stroke-width="1" fill="rgba(34,197,94,0.2)" stroke="#22C55E"></rect>
        <text x="760" y="215" text-anchor="middle" fill="#9CA3AF" font-size="12px">GitHub Actions</text>
        <text x="760" y="231" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(CI/CD Pipeline)</text>
    </g>
    
    <!-- Docker Containers -->
    <g>
        <rect x="40" y="271" width="200" height="40" rx="4" stroke-width="1" fill="rgba(20,184,166,0.2)" stroke="#14B8A6"></rect>
        <text x="140" y="295" text-anchor="middle" fill="#9CA3AF" font-size="12px">Docker Container #1</text>
        
        <rect x="260" y="271" width="170" height="40" rx="4" stroke-width="1" fill="rgba(20,184,166,0.2)" stroke="#14B8A6"></rect>
        <text x="345" y="295" text-anchor="middle" fill="#9CA3AF" font-size="12px">Docker Container #2</text>
        
        <rect x="450" y="271" width="190" height="40" rx="4" stroke-width="1" fill="rgba(20,184,166,0.2)" stroke="#14B8A6"></rect>
        <text x="545" y="295" text-anchor="middle" fill="#9CA3AF" font-size="12px">Docker Container #3</text>
    </g>
    
    <!-- EC2 Instances -->
    <g>
        <rect x="40" y="341" width="280" height="40" rx="4" stroke-width="1" fill="rgba(239,68,68,0.2)" stroke="#EF4444"></rect>
        <text x="180" y="365" text-anchor="middle" fill="#9CA3AF" font-size="12px">EC2 Instance #1 (Django + Celery)</text>
        
        <rect x="340" y="341" width="180" height="40" rx="4" stroke-width="1" fill="rgba(239,68,68,0.2)" stroke="#EF4444"></rect>
        <text x="430" y="365" text-anchor="middle" fill="#9CA3AF" font-size="12px">EC2 Instance #2 (Redis)</text>
    </g>
    
    <!-- Storage Layer -->
    <g>
        <rect x="40" y="411" width="350" height="64" rx="4" stroke-width="1" fill="rgba(168,85,247,0.2)" stroke="#A855F7"></rect>
        <text x="215" y="435" text-anchor="middle" fill="#9CA3AF" font-size="12px">PostgreSQL Database</text>
        <text x="215" y="455" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(Reviews • Users • Analytics)</text>
        
        <rect x="410" y="411" width="250" height="64" rx="4" stroke-width="1" fill="rgba(249,115,22,0.2)" stroke="#F97316"></rect>
        <text x="535" y="435" text-anchor="middle" fill="#9CA3AF" font-size="12px">AWS S3</text>
        <text x="535" y="455" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(Static Assets • Reports • Exports)</text>
        
        <rect x="680" y="411" width="180" height="64" rx="4" stroke-width="1" fill="rgba(34,197,94,0.2)" stroke="#22C55E"></rect>
        <text x="770" y="435" text-anchor="middle" fill="#9CA3AF" font-size="12px">GitHub</text>
        <text x="770" y="455" text-anchor="middle" fill="#9CA3AF" font-size="12px" font-weight="300">(Source Control)</text>
    </g>
    
    <!-- AWS Cloud Infrastructure -->
    <g>
        <rect x="40" y="506" width="820" height="40" rx="4" stroke-width="1" fill="rgba(20,184,166,0.2)" stroke="#14B8A6"></rect>
        <text x="450" y="530" text-anchor="middle" fill="#9CA3AF" font-size="12px">AWS Cloud Infrastructure</text>
    </g>
    
</svg>